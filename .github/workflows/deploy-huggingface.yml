# Deploys the app to a Hugging Face Space on every push to main.
# Setup (once), in GitHub: Settings -> Secrets and variables -> Actions
#   - Secret   HF_TOKEN : a Hugging Face access token with "write" permission
#   - Variable HF_SPACE : the Space id, e.g. your-hf-username/qe-studio
# Without both, the workflow skips deployment.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable not set - skipping deployment."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # Spaces read their settings from YAML front matter in README.md; add it only for the Space copy
          {
            printf -- '---\ntitle: QE Studio\nemoji: ⚛️\ncolorFrom: blue\ncolorTo: indigo\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'
            cat README.md
          } > README.space.md
          mv README.space.md README.md
          git add README.md
          git commit -q -m "Space configuration"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
